<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Asha Sorkari Sakori</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
<a class="logo" href="index.html">🏆 Asha Sorkari Sakori</a>
<nav class="nav"><a href="index.html">Home</a><a href="register.html">Register</a></nav>
</header>
<main class="container">
<section class="form-card">
<span class="badge">ACCOUNT LOGIN</span>
<h1>Welcome Back</h1>
<p>Login to continue your competitive-exam preparation.</p>
<form id="loginForm">
<div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="Email address" autocomplete="email" required></div>
<div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="Password" autocomplete="current-password" required></div>
<div id="loginMessage" class="message"></div>
<button class="btn" type="submit">Login</button>
</form>
<p>Don't have an account? <a href="register.html">Create Account</a></p>
</section>
</main>
<footer>Asha Sorkari Sakori — Competitive Exam Preparation</footer>
<script type="module" src="js/auth-pages.js"></script>
</body>
</html>
